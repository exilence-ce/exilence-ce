[package]
name = "ninja-drift"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../../domain" }
ninja = { path = "../../ninja" }
serde = { version = "1", features = ["derive"] }
