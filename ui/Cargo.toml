[package]
name = "ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ipc = { path = "../ipc" }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
# What's New and Credits (F19), rendered without raw HTML.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The item table filter's regular expressions (F11).
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlCollection", "Element", "Node", "Navigator", "DomRect", "EventTarget", "MouseEvent", "KeyboardEvent", "Location", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }
