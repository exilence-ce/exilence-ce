// Exilence CE NG client <-> backend wire contract.
//
// Decided in "What are the client↔backend gRPC services and messages?"
// (https://github.com/exilence-ce/migration/issues/17). Transport, stream
// lifetime and evolution rules: docs/adr/0004-grpc-with-group-only-stream.md.
// The shared crate in exilence-ce-ng copies this file verbatim and compiles it
// with tonic-prost-build + protox.
//
// Conventions
//
// - Evolution: additive only. New fields, new enum values and new oneof
//   variants; deleted field numbers are `reserved`. A client ignores event
//   variants it does not know and treats an unknown ErrorReason as a generic
//   error. There is no minimum-version gate.
// - Metadata on every call, including the stream open:
//   - `authorization: Bearer <session_token>` on every RPC except SignIn.
//   - `x-correlation-id: <UUIDv7>`, generated by the client per call and
//     logged before sending (F20). The backend logs it, echoes it in the
//     response headers, and generates one (UUIDv7) when it is missing or
//     not a UUID.
// - Errors: a gRPC status code plus an encoded ErrorDetail in the status
//   details (`grpc-status-details-bin`). See ErrorReason for the pairs.
//   UNAVAILABLE without an ErrorDetail means GGG (or the backend) cannot
//   serve the call right now (unreachable, or GGG answered 429 or 5xx); the
//   client treats it like a transport failure.
// - Size: at most 4 MiB per decoded message in both directions (tonic's
//   default). gRPC zstd message compression is on in both directions.
// - Ids: Profile, Snapshot and account ids are canonical lowercase UUID
//   strings. The client mints Profile and Snapshot ids as UUIDv7; an imported
//   legacy Profile keeps its legacy uuid. Creates are idempotent on id. The
//   account id is the GGG account `uuid` from `/profile`.
// - Item definition ids are content hashes, see ItemDefinition.
// - Times are UTC google.protobuf.Timestamp.

syntax = "proto3";

package exilence.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------- errors

// Carried in the status details of every error the client must tell apart.
message ErrorDetail {
  ErrorReason reason = 1;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // UNAUTHENTICATED. Missing, unknown or expired session token: the Login was
  // signed out or is older than 90 days. The client returns to login (F1).
  SESSION_EXPIRED = 1;
  // UNAUTHENTICATED. Another Login of the same account started a session
  // later. Every call of this Login fails so until it calls StartSession
  // again, except StartSession, RefreshGggToken (which D6 runs before a
  // session starts) and SignOut. The client goes offline and stays offline
  // until restarted (F13, D25).
  SUPERSEDED = 2;
  // FAILED_PRECONDITION. GGG refused the refresh token, or the stored one no
  // longer opens (sealing key changed) (RefreshGggToken). The client sends
  // the user to login (D6).
  GGG_REFRESH_FAILED = 3;
  // ALREADY_EXISTS. CreateGroup with a name in use.
  GROUP_NAME_TAKEN = 4;
  // NOT_FOUND. JoinGroup with a name not in use.
  GROUP_NOT_FOUND = 5;
  // PERMISSION_DENIED. JoinGroup with a wrong password; shown on the password
  // field, no toast (F13, F18).
  WRONG_PASSWORD = 6;
  // FAILED_PRECONDITION. OpenGroupStream or LeaveGroup while the account is
  // not a Group member, e.g. after the 5-minute grace expired (D22).
  NOT_IN_GROUP = 7;
  // INVALID_ARGUMENT. A request violates a rule stated on its message.
  INVALID_ARGUMENT = 8;
  // UNAUTHENTICATED. SignIn failed: GGG refused the code exchange or the
  // `/profile` check (a 4xx other than 429) (F1).
  GGG_AUTH_FAILED = 9;
}

// ---------------------------------------------------------------- auth

// Everything about GGG tokens (ADR 0001). The refresh token never leaves the
// backend. A later public OAuth client adds a sign-in RPC taking a GGG access
// token; nothing here changes.
service AuthService {
  // Unauthenticated. Exchanges the code with the client secret and the PKCE
  // verifier, checks the access token against GGG `/profile`, creates the
  // Login (encrypted refresh token, hashed session token) and returns its
  // session token. The client has already checked `state` (D18).
  // GGG_AUTH_FAILED; GGG 429, 5xx or unreachable: UNAVAILABLE.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Refreshes this Login's GGG access token: when it expires within 7 days
  // before a session starts or a Snapshot runs, and once on a GGG 401 (D6).
  // GGG_REFRESH_FAILED; GGG 429, 5xx or unreachable: UNAVAILABLE.
  rpc RefreshGggToken(RefreshGggTokenRequest) returns (RefreshGggTokenResponse);
  // Deletes this Login and revokes its GGG tokens; other Logins stay. Always
  // succeeds for a valid session; a failed revoke is logged on the backend
  // (D19). The revoke (`POST /oauth/token/revoke`) needs the `oauth:revoke`
  // scope on GGG's side.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
}

message SignInRequest {
  string code = 1;
  string code_verifier = 2;
}

message SignInResponse {
  // Opaque; valid until sign-out or the 90-day Login limit.
  string session_token = 1;
  GggAccessToken ggg_token = 2;
  Account account = 3;
}

message RefreshGggTokenRequest {}

message RefreshGggTokenResponse {
  GggAccessToken ggg_token = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message GggAccessToken {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message Account {
  // GGG account uuid.
  string id = 1;
  // Display only.
  string name = 2;
}

// ---------------------------------------------------------------- session

service SessionService {
  // Called at every launch and after every reconnect (F18). Makes this Login
  // the account's current one: an older Login's open stream gets Superseded,
  // and its later calls fail with SUPERSEDED. Records the client version and
  // last login.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
}

message StartSessionRequest {
  // The client's semver, e.g. "2.0.0-beta.1".
  string client_version = 1;
}

message StartSessionResponse {
  Account account = 1;
  // The account's complete Profile list; the client replaces its own with it.
  repeated Profile profiles = 2;
  // Empty when the account has no Profile yet; the client then creates
  // `profile 1` (F2).
  string active_profile_id = 3;
  // Set while the account is a Group member, including within the 5-minute
  // grace (D22). The client rejoins by calling OpenGroupStream with its
  // cursors.
  optional string group_name = 4;
}

// ---------------------------------------------------------------- profiles and snapshots

service ProfileService {
  // Idempotent on id: an existing id of this account returns OK unchanged.
  // Does not change the active Profile.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  // Replaces the Profile. INVALID_ARGUMENT for an id this account lacks.
  // Relays ActiveProfileChanged when it is the active Profile.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Relays ActiveProfileChanged.
  rpc SetActiveProfile(SetActiveProfileRequest) returns (SetActiveProfileResponse);
  // Deletes the Profile and the backend's copies of its Snapshots (D5).
  // INVALID_ARGUMENT for the active Profile (F2 switches first). Idempotent:
  // an unknown id returns OK. Relays nothing (members see only active
  // Profiles).
  rpc RemoveProfile(RemoveProfileRequest) returns (RemoveProfileResponse);
  // Stores the Snapshot (backend retention per ADR 0002) and upserts the
  // definitions. Idempotent on snapshot id. Relays SnapshotAdded when the
  // account is in a Group and the Snapshot's Profile is active, only when
  // newly stored (a retried upload relays nothing). Imported legacy
  // Snapshots are never uploaded. A call the client cancels (past its
  // deadline) stops: stored only if it committed before, so it never lands
  // after the client counted it as failed (D5).
  rpc UploadSnapshot(UploadSnapshotRequest) returns (UploadSnapshotResponse);
  // Deletes the backend's copies (D5), matched within the given Profile:
  // unknown ids and ids of the account's other Profiles are ignored;
  // a malformed Profile id is INVALID_ARGUMENT. Relays
  // SnapshotsRemoved when the account is in a Group and the Profile is active.
  rpc RemoveSnapshots(RemoveSnapshotsRequest) returns (RemoveSnapshotsResponse);
}

// A named tracking configuration (GLOSSARY: Profile).
message Profile {
  string id = 1;
  // Required, non-empty.
  string name = 2;
  // GGG league id.
  string league_id = 3;
  // poe.ninja league name (D21).
  string price_league_id = 4;
  // GGG stash tab ids, in selection order.
  repeated string stash_tab_ids = 5;
  optional string character_name = 6;
  bool include_equipment = 7;
  bool include_inventory = 8;
}

message CreateProfileRequest {
  Profile profile = 1;
}

message CreateProfileResponse {}

message UpdateProfileRequest {
  Profile profile = 1;
}

message UpdateProfileResponse {}

message SetActiveProfileRequest {
  string profile_id = 1;
}

message SetActiveProfileResponse {}

message RemoveProfileRequest {
  string profile_id = 1;
}

message RemoveProfileResponse {}

message UploadSnapshotRequest {
  Snapshot snapshot = 1;
  // Definitions referenced by the body that this client has not uploaded
  // before. Re-sending a known definition is harmless. A definition whose id
  // is not the hash of its content fails the call with INVALID_ARGUMENT.
  repeated ItemDefinition new_definitions = 2;
}

message UploadSnapshotResponse {}

message RemoveSnapshotsRequest {
  string profile_id = 1;
  repeated string snapshot_ids = 2;
}

message RemoveSnapshotsResponse {}

// One Snapshot as uploaded, stored and relayed. The typed fields serve charts,
// income and totals without decompressing; the body holds the items.
message Snapshot {
  string id = 1;
  string profile_id = 2;
  google.protobuf.Timestamp created_at = 3;
  // Sum of tab_values.
  double total_value = 4;
  repeated TabValue tab_values = 5;
  // zstd-3 compressed SnapshotBody, produced once by the uploading client;
  // the backend stores and relays these bytes unchanged. Empty when the
  // backend no longer keeps the body (retention, ADR 0002): the receiver then
  // has the totals only.
  bytes body = 6;
}

message TabValue {
  // GGG stash tab id; empty for the Character pseudo-tab.
  string tab_id = 1;
  // Chaos.
  double value = 2;
}

// The decompressed content of Snapshot.body. Never travels uncompressed.
message SnapshotBody {
  // poe.ninja league whose prices valued this Snapshot; D3 derives sparkline,
  // poe.ninja link and listing count from this league's prices when viewed.
  string price_league_id = 1;
  repeated SnapshotTab tabs = 2;
  // One price per referenced definition: parallel lists, sorted by id. The
  // price is the one used for the totals, custom price included (F6), in
  // chaos.
  repeated fixed64 priced_definition_ids = 3;
  repeated double prices = 4;
}

// A tab with its metadata as of this Snapshot (names change in game).
message SnapshotTab {
  // GGG stash tab id; empty for the Character pseudo-tab.
  string tab_id = 1;
  TabKind kind = 2;
  string name = 3;
  uint32 index = 4;
  // GGG `metadata.colour`.
  string colour = 5;
  // The tab's merged item rows (F3): parallel lists, one row per definition.
  // A row's total is stack_size * its definition's price. Only rows that
  // survive the pricing options of F5 are present.
  repeated fixed64 definition_ids = 6;
  repeated uint32 stack_sizes = 7;
}

enum TabKind {
  TAB_KIND_UNSPECIFIED = 0;
  TAB_KIND_STASH = 1;
  // Inventory and/or equipment of the Profile's character (F3); counted in
  // totals, not charted per tab (F10).
  TAB_KIND_CHARACTER = 2;
}

// What an item is, independent of stack size and price. Attributes come from
// the GGG item (D1), derived as legacy `mapItemsToPricedItems` does. These are
// exactly the fields legacy pricing (`pricing.service.ts`) and item merging
// (`findItem`) read.
message ItemDefinition {
  // xxh3-64 of this message's prost encoding with `id` left 0. Identical
  // items hash alike across Profiles, devices and accounts, so definitions
  // need no allocation and are shared by everyone. The backend checks the
  // hash before storing a definition, so a new field must reach the backend
  // before any client sends it.
  fixed64 id = 1;
  // Legacy-derived name: base type for non-unique maps.
  string name = 2;
  string type_line = 3;
  uint32 frame_type = 4;
  string icon = 5;
  // Seed tier for seeds.
  uint32 ilvl = 6;
  // Map tier, 0 otherwise.
  uint32 tier = 7;
  uint32 links = 8;
  uint32 sockets = 9;
  uint32 quality = 10;
  uint32 level = 11;
  string variant = 12;
  bool corrupted = 13;
  bool elder = 14;
  bool shaper = 15;
  bool blighted = 16;
  // Was `coffin`: poe.ninja no longer prices Filled Coffins (D29).
  reserved 17;
  reserved "coffin";
  bool beast = 18;
}

// ---------------------------------------------------------------- groups

service GroupService {
  // Whether a Group with this name exists; asked when the name field loses
  // focus (F13). Group names match without regard to case. CheckGroupName,
  // CreateGroup and JoinGroup first trim leading and trailing whitespace
  // (Unicode White_Space) from the name, so " Foo " and "foo" are the same
  // name; inner whitespace is kept.
  rpc CheckGroupName(CheckGroupNameRequest) returns (CheckGroupNameResponse);
  // Creates the Group and makes the caller its member, leaving any previous
  // Group first. GROUP_NAME_TAKEN, INVALID_ARGUMENT.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  // Checks the password (a Group without one admits only an empty one) and
  // makes the caller a member, leaving any previous Group first.
  // GROUP_NOT_FOUND, WRONG_PASSWORD.
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  // Ends membership at once; others get MemberLeft and the caller's stream
  // ends. NOT_IN_GROUP.
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  // Opened right after CreateGroup/JoinGroup and on rejoin (StartSession
  // returned a group_name). Holding it is "connected" for the 5-minute grace
  // (D22). The first event is always GroupSync. NOT_IN_GROUP.
  rpc OpenGroupStream(OpenGroupStreamRequest) returns (stream GroupEvent);
  // Definitions a receiver lacks after GroupSync or a relayed Snapshot.
  // At most 10,000 ids (INVALID_ARGUMENT beyond); unknown ids are omitted
  // from the response.
  rpc GetItemDefinitions(GetItemDefinitionsRequest) returns (GetItemDefinitionsResponse);
}

message CheckGroupNameRequest {
  // Trimmed, then matched without regard to case (GroupService).
  string name = 1;
}

message CheckGroupNameResponse {
  bool exists = 1;
}

message CreateGroupRequest {
  // Required, not empty after trimming; stored trimmed. Only whitespace is
  // refused (INVALID_ARGUMENT).
  string name = 1;
  // Empty means no password; otherwise at least 6 characters. Never logged
  // (F20).
  string password = 2;
}

message CreateGroupResponse {}

message JoinGroupRequest {
  // Trimmed, then matched without regard to case (GroupService).
  string name = 1;
  string password = 2;
}

message JoinGroupResponse {}

message LeaveGroupRequest {}

message LeaveGroupResponse {}

message OpenGroupStreamRequest {
  // On rejoin, the newest Snapshot the client holds per member. Empty on a
  // first join.
  repeated MemberCursor cursors = 1;
}

message MemberCursor {
  string account_id = 1;
  string newest_snapshot_id = 2;
}

message GetItemDefinitionsRequest {
  repeated fixed64 ids = 1;
}

message GetItemDefinitionsResponse {
  repeated ItemDefinition definitions = 1;
}

// Server -> client. Events about the caller's own account are never sent back
// to it, except in GroupSync's member list.
message GroupEvent {
  oneof event {
    GroupSync sync = 1;
    MemberJoined member_joined = 2;
    MemberLeft member_left = 3;
    ActiveProfileChanged active_profile_changed = 4;
    SnapshotAdded snapshot_added = 5;
    SnapshotsRemoved snapshots_removed = 6;
    Heartbeat heartbeat = 7;
    Superseded superseded = 8;
  }
}

// The Group's complete state; first event of every stream, ordered before all
// later events.
message GroupSync {
  string group_name = 1;
  // All members, the caller included (with no Snapshots).
  repeated Member members = 2;
}

message Member {
  Account account = 1;
  // Inactive Profiles are never sent.
  Profile active_profile = 2;
  // Oldest first. In GroupSync: the member's Snapshots of the active Profile
  // newer than the caller's cursor; the latest one alone when there is no
  // cursor or the cursor is not in that Profile (D4). In MemberJoined: the
  // latest one. Empty when the member has none, e.g. only imported Snapshots.
  repeated Snapshot snapshots = 3;
}

// Another account became a member. Appears unselected (F13).
message MemberJoined {
  Member member = 1;
}

// A member left, or their 5-minute grace expired (D22).
message MemberLeft {
  string account_id = 1;
}

// A member switched Profile, or edited the active one (D8).
message ActiveProfileChanged {
  string account_id = 1;
  Profile profile = 2;
  // The latest Snapshot of that Profile when the Profile changed (D4); unset
  // on an edit or when the Profile has none.
  optional Snapshot latest_snapshot = 3;
}

message SnapshotAdded {
  string account_id = 1;
  Snapshot snapshot = 2;
  // As uploaded; the receiver fetches anything else it lacks with
  // GetItemDefinitions.
  repeated ItemDefinition new_definitions = 3;
}

message SnapshotsRemoved {
  string account_id = 1;
  string profile_id = 2;
  repeated string snapshot_ids = 3;
}

// Every 30 s, under Cloudflare's 125 s read timeout.
message Heartbeat {}

// The same account started a session elsewhere (F13). The backend ends the
// stream after this event; the client goes offline until restarted.
message Superseded {}
